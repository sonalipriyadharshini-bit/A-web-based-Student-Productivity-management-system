<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - StudyFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --orange: #f5a623;
  --orange-dark: #e8960f;
  --sidebar-bg: #1a1a2e;
  --sidebar-active: #2a2a40;
  --bg: #f0f2f7;
  --white: #fff;
  --text-dark: #1a1a2e;
  --text-gray: #6b7280;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.07);
}

body { font-family: 'Manrope', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 260px; min-width: 260px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 22px 24px; font-size: 18px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.07); text-decoration: none; color: white; }
.logo-icon { width: 34px; height: 34px; background: var(--orange); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.nav-menu { list-style: none; padding: 18px 12px; flex: 1; }
.nav-menu li { margin-bottom: 4px; }
.nav-menu li a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; text-decoration: none; color: rgba(255,255,255,0.65); font-size: 14px; font-weight: 600; transition: 0.2s; }
.nav-menu li a:hover { background: rgba(255,255,255,0.08); color: white; }
.nav-menu li.active a { background: var(--sidebar-active); color: var(--orange); border-left: 3px solid var(--orange); }
.nav-icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 16px 12px 24px; border-top: 1px solid rgba(255,255,255,0.07); }
.logout-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 10px 16px; border-radius: 10px; width: 100%; font-family: 'Manrope',sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
.logout-btn:hover { background: rgba(255,80,80,0.15); color: #ff6b6b; }

/* MAIN */
.main { flex: 1; overflow-y: auto; padding: 36px 40px; }

/* PROFILE HEADER */
.profile-header {
  display: flex; align-items: center; gap: 24px;
  background: var(--white); border-radius: 18px;
  padding: 28px 32px; margin-bottom: 24px;
  box-shadow: var(--card-shadow);
}

.avatar-wrap { position: relative; }

.avatar {
  width: 90px; height: 90px; border-radius: 50%;
  background: var(--orange); display: flex; align-items: center;
  justify-content: center; font-size: 36px; overflow: hidden;
  border: 3px solid #fff3e0;
}

.avatar img { width: 100%; height: 100%; object-fit: cover; }

.profile-info h2 { font-size: 22px; font-weight: 800; }
.profile-info p { color: var(--text-gray); font-size: 14px; margin-top: 4px; }
.profile-badge {
  display: inline-block; background: #fff3e0; color: var(--orange);
  font-size: 12px; font-weight: 700; padding: 4px 12px;
  border-radius: 20px; margin-top: 8px;
}

/* FORM CARD */
.form-card { background: var(--white); border-radius: 18px; padding: 28px 32px; margin-bottom: 20px; box-shadow: var(--card-shadow); }

.section-title {
  font-size: 16px; font-weight: 800; color: var(--orange);
  margin-bottom: 20px; padding-bottom: 10px;
  border-bottom: 2px solid #fff3e0;
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-full { grid-column: 1 / -1; }

.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-group label { font-size: 13px; font-weight: 700; color: var(--text-dark); }

.input-group input,
.input-group select {
  padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px;
  font-family: 'Manrope', sans-serif; font-size: 14px; outline: none;
  transition: border-color 0.2s; background: white;
}
.input-group input:focus,
.input-group select:focus { border-color: var(--orange); }
.input-group input:disabled { background: #f9fafb; color: var(--text-gray); }

/* BUTTONS */
.btn-row { display: flex; gap: 12px; margin-top: 8px; }

.btn-save {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  background: var(--orange); color: white;
  font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background 0.2s;
}
.btn-save:hover { background: var(--orange-dark); }

.btn-back {
  padding: 13px 22px; border: 1.5px solid #e5e7eb; border-radius: 12px;
  background: white; color: var(--text-dark);
  font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: 0.2s; text-decoration: none;
  display: flex; align-items: center;
}
.btn-back:hover { border-color: var(--orange); }

/* TOAST */
.toast { position: fixed; bottom: 30px; right: 30px; background: #22c55e; color: white; padding: 12px 22px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 9999; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: #ff4d4f; }

/* RESPONSIVE */
@media(max-width:800px) { .form-grid { grid-template-columns: 1fr; } }
@media(max-width:700px) { body { flex-direction: column; overflow: auto; height: auto; } .sidebar { width: 100%; min-width: 100%; } .main { padding: 24px 18px; } .profile-header { flex-direction: column; text-align: center; } }
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <a class="sidebar-logo" href="{{ url_for('home') }}">
    <div class="logo-icon">🔥</div> StudyFlow
  </a>
  <ul class="nav-menu">
    <li><a href="{{ url_for('dashboard') }}"><span class="nav-icon">⊞</span> Dashboard</a></li>
    <li><a href="{{ url_for('pomodoro') }}"><span class="nav-icon">⏱</span> Pomodoro</a></li>
    <li><a href="{{ url_for('todo') }}"><span class="nav-icon">☑</span> To-Do</a></li>
    <li><a href="{{ url_for('timetable') }}"><span class="nav-icon">📅</span> Timetable</a></li>
    <li><a href="{{ url_for('habits') }}"><span class="nav-icon">🔥</span> Habits</a></li>
    <li class="active"><a href="{{ url_for('profile') }}"><span class="nav-icon">👤</span> Profile</a></li>
  </ul>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">

  <!-- PROFILE HEADER -->
  <div class="profile-header">
    <div class="avatar-wrap">
      <div class="avatar" id="avatarDisplay">👤</div>
    </div>
    <div class="profile-info">
      <h2 id="display-name">Loading...</h2>
      <p id="display-email"></p>
      <span class="profile-badge" id="display-edu">Student</span>
    </div>
  </div>

  <!-- PERSONAL INFO -->
  <div class="form-card">
    <div class="section-title">1️⃣ Personal Information</div>
    <div class="form-grid">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="full_name" placeholder="Your full name">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" disabled>
      </div>
      <div class="input-group">
        <label>Profile Picture URL</label>
        <input type="text" id="photo_url" placeholder="https://...">
      </div>
      <div class="input-group">
        <label>Educational Level</label>
        <select id="education">
          <option>High School</option>
          <option>University</option>
          <option>Masters</option>
          <option>PhD</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ACADEMIC -->
  <div class="form-card">
    <div class="section-title">2️⃣ Academic Context</div>
    <div class="form-grid">
      <div class="input-group">
        <label>Major / Field of Study</label>
        <input type="text" id="major" placeholder="e.g. Computer Science">
      </div>
      <div class="input-group">
        <label>Current Semester</label>
        <input type="text" id="semester" placeholder="e.g. Semester 3">
      </div>
      <div class="input-group">
        <label>Institution Name</label>
        <input type="text" id="institution" placeholder="Your college/university">
      </div>
      <div class="input-group">
        <label>Target GPA / Goal</label>
        <input type="text" id="target_gpa" placeholder="e.g. 3.8 / First Class">
      </div>
    </div>
  </div>

  <!-- TIME -->
  <div class="form-card">
    <div class="section-title">3️⃣ Time & Availability</div>
    <div class="form-grid">
      <div class="input-group">
        <label>Time Zone</label>
        <input type="text" id="timezone" placeholder="e.g. Asia/Kolkata">
      </div>
      <div class="input-group">
        <label>Wake-up Time</label>
        <input type="time" id="wake_time">
      </div>
      <div class="input-group">
        <label>Sleep Time</label>
        <input type="time" id="sleep_time">
      </div>
      <div class="input-group">
        <label>Busy Hours</label>
        <input type="text" id="work_hours" placeholder="e.g. Mon-Fri 5PM-8PM">
      </div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <a href="{{ url_for('dashboard') }}" class="btn-back">← Back</a>
    <button class="btn-save" onclick="saveProfile()">💾 Save Profile</button>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">✅ Profile saved!</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCK339IcGf7kR6zegZUAz93GaCHbDTVbsI",
  authDomain: "smart-study-planner-6bc26.firebaseapp.com",
  projectId: "smart-study-planner-6bc26",
  storageBucket: "smart-study-planner-6bc26.firebasestorage.app",
  messagingSenderId: "536615775632",
  appId: "1:536615775632:web:15f704b6c9d60a68435715"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "/"; return; }

  // Register session
  await fetch("/api/set_user", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ uid: user.uid, name: user.displayName || user.email.split('@')[0], email: user.email })
  });

  // Set email (from Firebase)
  document.getElementById('email').value = user.email;

  // Show Google photo if available
  if(user.photoURL){
    document.getElementById('avatarDisplay').innerHTML = `<img src="${user.photoURL}" alt="avatar">`;
  }

  // Load saved profile from SQLite
  loadProfile(user);
});

window.logout = function(){
  signOut(auth).then(() => { window.location.href = "/"; });
};

// ── Load profile ──────────────────────────────────────────────
async function loadProfile(user){
  try {
    const res  = await fetch("/api/profile");
    const data = await res.json();

    const fields = ['full_name','photo_url','education','major','semester','institution','target_gpa','timezone','wake_time','sleep_time','work_hours'];
    fields.forEach(f => {
      const el = document.getElementById(f);
      if(el && data[f]) el.value = data[f];
    });

    // Update display name
    const name = data.full_name || user.displayName || user.email.split('@')[0];
    document.getElementById('display-name').textContent = name;
    document.getElementById('display-email').textContent = user.email;
    document.getElementById('display-edu').textContent   = data.education || 'Student';

    // Update photo if saved
    if(data.photo_url){
      document.getElementById('avatarDisplay').innerHTML = `<img src="${data.photo_url}" alt="avatar">`;
    }

  } catch(e){ console.error(e); }
}

// ── Save profile ──────────────────────────────────────────────
window.saveProfile = async function(){
  const data = {
    full_name:   document.getElementById('full_name').value,
    email:       document.getElementById('email').value,
    photo_url:   document.getElementById('photo_url').value,
    education:   document.getElementById('education').value,
    major:       document.getElementById('major').value,
    semester:    document.getElementById('semester').value,
    institution: document.getElementById('institution').value,
    target_gpa:  document.getElementById('target_gpa').value,
    timezone:    document.getElementById('timezone').value,
    wake_time:   document.getElementById('wake_time').value,
    sleep_time:  document.getElementById('sleep_time').value,
    work_hours:  document.getElementById('work_hours').value
  };

  try {
    await fetch("/api/profile/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    showToast('✅ Profile saved successfully!');

    // Update display
    if(data.full_name)  document.getElementById('display-name').textContent = data.full_name;
    if(data.education)  document.getElementById('display-edu').textContent  = data.education;
    if(data.photo_url)  document.getElementById('avatarDisplay').innerHTML  = `<img src="${data.photo_url}" alt="avatar">`;

  } catch(e){
    showToast('❌ Failed to save. Try again.', true);
  }
};

function showToast(msg='✅ Saved!', error=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast' + (error ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

</script>
</body>
</html>
